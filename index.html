  // Áp dụng giao diện sáng/tối ngay từ đầu để không bị nháy màu

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<body>
<div id="boot" style="padding:28px 20px;font:15px/1.6 system-ui,sans-serif;color:#555;max-width:720px;margin:0 auto">Đang tải trang… Nếu dòng này vẫn còn sau 10 giây thì trang bị lỗi, hãy chụp màn hình gửi lại cho người hỗ trợ.</div>
<div id="shell"><nav id="rail"></nav><main id="panel"><div id="topbar"></div><div id="view"></div></main></div>
<div id="toasts"></div>
<noscript>Trang web cần bật JavaScript để hoạt động.</noscript>
<script>
  // Hiện lỗi ngay trên màn hình (thay vì trang trắng) để dễ tìm nguyên nhân
  function showErr(m){var b=document.getElementById('boot');if(!b)return;b.style.color='#b00020';
    b.innerHTML='<b>Trang bị lỗi khi tải. Hãy chụp màn hình này gửi lại:</b><pre style="white-space:pre-wrap;background:#fff3f3;padding:12px;border-radius:8px;margin-top:10px">'+String(m).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>';}
  addEventListener('error',function(e){var t=e.target||{};showErr(e.message?e.message+(e.filename?'\n'+e.filename+':'+e.lineno:''):'Không tải được file: '+(t.src||t.href||'?'));},true);
  addEventListener('unhandledrejection',function(e){showErr((e.reason&&(e.reason.stack||e.reason.message))||e.reason);});
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
